<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>오프라인 · 미너비니 스크리너</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px; text-align: center;
      background: #131722; color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
    }
    .mark { color: #2962ff; }
    h1 { font-size: 1.15rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    p { font-size: 0.9rem; color: #787b86; margin: 0; line-height: 1.65; }
    button {
      margin-top: 6px; background: #1e222d; border: 1px solid #2a2e39; color: #d1d4dc;
      padding: 11px 20px; border-radius: 4px; font-size: 0.9rem; cursor: pointer; font-weight: 550;
    }
    button:hover { border-color: #2962ff; }
  </style>
</head>
<body>
  <svg class="mark" width="56" height="40" viewBox="0 0 28 20" fill="none" aria-hidden="true">
    <path d="M1,11 Q4,2 7,11 Q10,4 13,11 Q15,7 17,11 L25,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19,3 L25,3 L25,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>인터넷 연결이 없습니다</h1>
  <p>지금은 오프라인 상태예요.<br>연결이 돌아오면 새로고침해 주세요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</body>
</html>
