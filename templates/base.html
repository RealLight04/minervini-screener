<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f9f9f7" id="themeColorMeta">
  <title>{% block title %}Minervini Screener{% endblock %}</title>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search).get('theme');
      if (qs === 'dark' || qs === 'light') localStorage.setItem('theme', qs);
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root, :root[data-theme="light"] {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --surface-2: #f4f4f2;
      --inset: #f1f1ee;
      --border: #e1e0d9;
      --line: #ececea;
      --text: #0b0b0b;
      --muted: #52514e;
      --faint: #898781;
      --accent: #2563eb;
      --accent-ink: #ffffff;
      --green: #16a34a;
      --green-ink: #15803d;
      --red: #dc2626;
      --red-ink: #b91c1c;
      --amber: #b45309;
      --violet: #7c3aed;
      --orange: #c2410c;
      --badge-green-bg: #e3f5e3;
      --badge-red-bg: #fbe9e9;
      --badge-gray-bg: #eeeeec;
      --badge-blue-bg: #e7f0fb;
      --badge-violet-bg: #ece9f7;
      --header-bg: rgba(249,249,247,.85);
      --row-hover: rgba(42,120,214,.06);
      --chart-bg: #fcfcfb;
      --chart-text: #52514e;
      --chart-grid: #e1e0d9;
      --chart-axis: #c3c2b7;
      --radius: 8px;
      --radius-sm: 5px;
      --gap: 16px;
      --shadow: 2px 2px 0 0 rgba(11,11,11,.06);
      --dot: rgba(11,11,11,.09);
    }
    :root[data-theme="dark"] {
      --bg: #05070d;
      --surface: #0d1220;
      --surface-2: #05070d;
      --inset: #020308;
      --border: #1e2538;
      --line: #131a2b;
      --text: #e2e8f0;
      --muted: #8b96a8;
      --faint: #596177;
      --accent: #38bdf8;
      --accent-ink: #05070d;
      --green: #4ade80;
      --green-ink: #4ade80;
      --red: #f87171;
      --red-ink: #f87171;
      --amber: #fbbf24;
      --violet: #a78bfa;
      --orange: #fb923c;
      --badge-green-bg: #0f3d21;
      --badge-red-bg: #350808;
      --badge-gray-bg: #171d2e;
      --badge-blue-bg: #142a45;
      --badge-violet-bg: #2c1548;
      --header-bg: rgba(5,7,13,.85);
      --row-hover: rgba(56,189,248,.06);
      --chart-bg: #0d1220;
      --chart-text: #8b96a8;
      --chart-grid: #05070d;
      --chart-axis: #232c42;
      --shadow: 2px 2px 0 0 rgba(0,0,0,.45);
      --dot: rgba(255,255,255,.055);
    }
    /* 서버에서 계산된 상태색(신호·시장국면 등)을 라이트/다크 모드에 맞게 전환하는 유틸 */
    .tone-text { color: var(--tone-light); }
    .tone-tint { background: color-mix(in srgb, var(--tone-light) 13%, var(--surface)); border-color: color-mix(in srgb, var(--tone-light) 38%, transparent); }
    .tone-badge { background: color-mix(in srgb, var(--tone-light) 16%, var(--surface)); color: var(--tone-light); border: 1px solid color-mix(in srgb, var(--tone-light) 45%, transparent); }
    :root[data-theme="dark"] .tone-text { color: var(--tone-dark); }
    :root[data-theme="dark"] .tone-tint { background: color-mix(in srgb, var(--tone-dark) 13%, var(--surface)); border-color: color-mix(in srgb, var(--tone-dark) 38%, transparent); }
    :root[data-theme="dark"] .tone-badge { background: color-mix(in srgb, var(--tone-dark) 16%, var(--surface)); color: var(--tone-dark); border-color: color-mix(in srgb, var(--tone-dark) 45%, transparent); }
    .code33-banner { background: linear-gradient(90deg, var(--badge-green-bg), color-mix(in srgb, var(--green) 22%, var(--surface))); border: 1px solid color-mix(in srgb, var(--green) 40%, transparent); }

    /* ───── 도넛 게이지 ───── */
    .gauge-row { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; }
    .gauge-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .gauge {
      --gauge-color: var(--accent);
      width: 60px; height: 60px; border-radius: 50%;
      background: conic-gradient(var(--gauge-color) calc(var(--gauge-pct, 0) * 1%), var(--border) 0);
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .gauge::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
    .gauge span { position: relative; font-weight: 750; font-size: 0.84rem; z-index: 1; }
    .gauge-label { font-size: 0.74rem; color: var(--muted); text-align: center; line-height: 1.4; }
    .tone-gauge { --gauge-color: var(--tone-light); }
    :root[data-theme="dark"] .tone-gauge { --gauge-color: var(--tone-dark); }

    /* ───── 스파크라인 ───── */
    .sparkline { display: block; overflow: visible; }

    :root {
      --font-body: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard',
                   'Malgun Gothic', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-display: Georgia, 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
      --font-mono: 'SF Mono', 'Cascadia Code', 'D2Coding', Consolas, 'Liberation Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.003em;
    }
    /* 금융 수치: 자릿수 정렬 + 터미널 느낌의 모노스페이스 */
    .num, .financial-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ───── 헤더 ───── */
    header {
      background: var(--header-bg);
      backdrop-filter: saturate(160%) blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .nav {
      max-width: 1120px; margin: 0 auto;
      padding: 12px 18px;
      display: flex; align-items: center; gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; font-style: italic; color: var(--text); text-decoration: none; white-space: nowrap; letter-spacing: -0.01em; }
    .brand span { color: var(--accent); }
    .brand-mark { color: var(--accent); flex-shrink: 0; }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color .15s; }
    .nav a:hover { color: var(--text); }
    .search { margin-left: auto; position: relative; }
    .search input {
      background: var(--inset); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px 8px 32px; border-radius: 10px; font-size: 0.88rem; width: 200px;
      transition: border-color .15s, width .2s;
    }
    .search input:focus { outline: none; border-color: var(--accent); }
    .search::before {
      content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 0.8rem; opacity: .6; pointer-events: none;
    }

    .container { max-width: 1120px; margin: 0 auto; padding: 26px 18px 64px; }

    /* ───── 타이포 ───── */
    h2.page-title { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; }
    .section-title {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      font-size: 1.08rem; font-weight: 730; margin: 32px 0 14px; letter-spacing: -0.01em;
      padding-left: 11px; border-left: 3px solid currentColor;
    }
    .section-title .hint { font-weight: 400; font-size: 0.82rem; color: var(--faint); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }

    /* ───── 종목 상세: 섹션 제목·설명·지표카드 (가독성 표준) ───── */
    .sec-title {
      display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
      font-size: 1.05rem; font-weight: 720; color: var(--text);
      letter-spacing: -0.01em; margin: 32px 0 14px; padding-left: 11px;
      border-left: 3px solid var(--accent);
    }
    .sec-title .sub { font-weight: 400; font-size: 0.8rem; color: var(--faint); }
    .note { color: var(--muted); font-size: 0.82rem; line-height: 1.7; }
    .note-sm { color: var(--faint); font-size: 0.78rem; line-height: 1.65; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 11px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 15px; }
    .stat .k { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .stat .v { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.01em; }

    /* ───── 카드 ───── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
    }

    /* ───── 배지 / 칩 ───── */
    .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 650; white-space: nowrap; }
    .badge-green { background: var(--badge-green-bg); color: var(--green-ink); }
    .badge-red { background: var(--badge-red-bg); color: var(--red-ink); }
    .badge-gray { background: var(--badge-gray-bg); color: var(--muted); }

    /* ───── 버튼 ───── */
    .btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 8px 15px; cursor: pointer; font-size: 0.86rem; font-weight: 550;
      transition: border-color .15s, background .15s; -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { border-color: var(--accent); }

    /* ───── 탭 ───── */
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab {
      text-decoration: none; padding: 8px 17px; border-radius: 10px; font-size: 0.88rem; font-weight: 600;
      background: var(--surface); color: var(--muted); border: 1px solid var(--border); transition: all .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    /* ───── 차트 범례 ───── */
    .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 0.76rem; color: var(--muted); align-items: center; }
    .chart-legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .chart-legend .ln { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 2px; }
    .chart-legend .ln.thick { height: 4px; }
    .chart-legend .ln.dash { height: 0; border-top: 2px dotted currentColor; background: none; }

    /* ───── 테이블 ───── */
    /* overflow-x:auto는 세로축도 auto로 만들어 sticky thead를 이 래퍼 기준으로 깨뜨리므로,
       가로 스크롤이 실제 필요한(그리고 thead가 안 보여 sticky도 무관한) 모바일 폭에서만 적용 */
    .table-wrap { border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 11px 13px; background: var(--inset); color: var(--muted);
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      white-space: nowrap; border-bottom: 1px solid var(--border);
      position: sticky; top: 58px; z-index: 5;
    }
    tbody td { padding: 12px 13px; border-bottom: 1px solid var(--line); font-size: 0.9rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .12s; }
    tbody tr[data-href] { cursor: pointer; }
    tbody tr:hover td { background: var(--row-hover); }
    tr.hot-row td { background: color-mix(in srgb, var(--amber) 14%, var(--surface)); }
    a.ticker-link { color: var(--accent); text-decoration: none; font-weight: 650; }
    a.ticker-link:hover { text-decoration: underline; }
    a.tv-link {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--faint); vertical-align: middle; transition: color .15s;
      padding: 10px 7px; margin: -10px -7px -10px 0px; /* 시각적 크기는 유지하고 탭 영역만 확장 */
    }
    a.tv-link:hover { color: var(--accent); }
    th.num, td.num { text-align: right; }
    th.ctr, td.ctr { text-align: center; }

    /* 정렬 가능한 헤더 */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); }
    th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    th.sortable::after { content: '↕'; margin-left: 4px; opacity: .4; font-size: 0.85em; }
    th.sortable[data-dir="asc"]::after { content: '▲'; opacity: 1; color: var(--accent); }
    th.sortable[data-dir="desc"]::after { content: '▼'; opacity: 1; color: var(--accent); }

    /* '근거' 등 긴 텍스트 셀 — 데스크톱은 말줄임 + 호버 툴팁, 모바일(.stack)은 그대로 전체 표시 */
    @media (min-width: 721px) {
      td.reason { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
      td.reason[data-tt]:hover { overflow: visible; }
      td.reason[data-tt]:hover::after {
        content: attr(data-tt);
        position: absolute; left: 0; top: 100%; margin-top: 4px; z-index: 20;
        background: var(--text); color: var(--bg); padding: 9px 11px; border-radius: 6px;
        font-size: 0.78rem; line-height: 1.5; white-space: normal; width: max-content; max-width: 320px;
        box-shadow: var(--shadow); font-family: var(--font-body);
      }
    }

    /* 모바일: 테이블 → 카드 스택 */
    @media (max-width: 720px) {
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table.cards { display: block; }
      table.cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      table.cards tbody { display: flex; flex-direction: column; gap: 11px; }
      table.cards tr {
        display: block; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 6px 15px;
      }
      table.cards tr:hover td { background: none; }
      table.cards td {
        display: flex; justify-content: space-between; align-items: center; gap: 14px;
        padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; text-align: right;
      }
      table.cards tr td:last-child { border-bottom: none; }
      table.cards td::before {
        content: attr(data-label); color: var(--muted); font-size: 0.78rem; font-weight: 500;
        text-align: left; white-space: nowrap; letter-spacing: 0;
      }
      table.cards td[data-label=""]::before { content: none; }
      /* 근거처럼 긴 텍스트 셀은 세로로 */
      table.cards td.stack { flex-direction: column; align-items: stretch; text-align: left; gap: 4px; }
    }

    /* ───── 반응형 헤더 ───── */
    /* 로고+토글은 1행에 남기고, nav-links·검색창은 각각 전체 폭의 독립된 행으로 내림
       (flex-wrap의 아이템 단위 줄바꿈에 맡기면 폭 계산이 어긋나 가로 스크롤이 생길 수 있어 flex-basis:100%로 강제) */
    @media (max-width: 600px) {
      .nav { padding: 11px 15px; gap: 10px; flex-wrap: wrap; }
      .brand { font-size: 1.05rem; }
      .nav-links { gap: 14px; order: 3; flex: 1 1 100%; }
      .search { margin-left: 0; order: 4; flex: 1 1 100%; }
      .search input { width: 100%; }
      .search input:focus { width: 100%; }
      .container { padding: 20px 14px 56px; }
      h2.page-title { font-size: 1.3rem; }
      .section-title { margin: 26px 0 12px; }
    }

    /* ───── 다크모드 토글 ───── */
    .theme-toggle {
      background: var(--inset); border: 1px solid var(--border); color: var(--text);
      width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent; transition: border-color .15s;
    }
    .theme-toggle:hover { border-color: var(--accent); }
    :root[data-theme="dark"] .theme-toggle .i-light,
    :root:not([data-theme="dark"]) .theme-toggle .i-dark { display: none; }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="/">
        <svg class="brand-mark" width="26" height="18" viewBox="0 0 28 20" fill="none" aria-hidden="true">
          <path d="M1,11 Q4,2 7,11 Q10,4 13,11 Q15,7 17,11 L25,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19,3 L25,3 L25,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
        </svg>
        <span>Minervini</span> Screener
      </a>
      <div class="nav-links">
        <a href="/">홈</a>
        <a href="/vcp">🌀 VCP</a>
        <a href="/watchlist">⭐ 관심종목</a>
        <a href="/alerts">📬 알림</a>
      </div>
      <form class="search" action="/search" method="get">
        <input name="ticker" placeholder="티커 검색" autocomplete="off" aria-label="티커 검색">
      </form>
      <button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="다크모드 전환" title="라이트/다크 모드 전환">
        <span class="i-dark">🌙</span><span class="i-light">☀️</span>
      </button>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    function toggleTheme() {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      // 캔들 차트(lightweight-charts)는 CSS가 아니라 JS로 그려서, 새로고침으로 확실히 다시 그림
      location.reload();
    }
    (function () {
      var meta = document.getElementById('themeColorMeta');
      var theme = document.documentElement.getAttribute('data-theme');
      if (meta && theme === 'dark') meta.setAttribute('content', '#05070d');
    })();
    // 표 행 전체 클릭 시 이동 (data-href 지정된 tr만) — 링크/버튼 클릭은 그대로 두어 중복 방지
    document.addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-href]');
      if (tr && !e.target.closest('a, button')) location.href = tr.dataset.href;
    });
    // 정렬 헤더 접근성: 키보드 포커스 가능 + 스크린리더용 role/aria-sort 부여
    Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function (h) {
      h.setAttribute('tabindex', '0');
      h.setAttribute('role', 'button');
      h.setAttribute('aria-sort', 'none');
    });
    // 헤더 클릭/Enter·Space → 컬럼 정렬 (th.sortable + 같은 열 td[data-sort] 필요)
    function sortByHeader(th) {
      var table = th.closest('table');
      var tbody = table.querySelector('tbody');
      if (!tbody) return;
      var idx = Array.prototype.indexOf.call(th.parentNode.children, th);
      var asc = th.getAttribute('data-dir') !== 'asc';
      Array.prototype.forEach.call(table.querySelectorAll('th.sortable'), function (h) {
        h.removeAttribute('data-dir'); h.setAttribute('aria-sort', 'none');
      });
      th.setAttribute('data-dir', asc ? 'asc' : 'desc');
      th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
      var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
      rows.sort(function (ra, rb) {
        var av = ra.children[idx] ? ra.children[idx].getAttribute('data-sort') : null;
        var bv = rb.children[idx] ? rb.children[idx].getAttribute('data-sort') : null;
        var an = parseFloat(av), bn = parseFloat(bv);
        var cmp = (!isNaN(an) && !isNaN(bn)) ? (an - bn) : String(av || '').localeCompare(String(bv || ''), 'ko');
        return asc ? cmp : -cmp;
      });
      rows.forEach(function (r) { tbody.appendChild(r); });
    }
    document.addEventListener('click', function (e) {
      var th = e.target.closest('th.sortable');
      if (th) sortByHeader(th);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var th = e.target.closest('th.sortable');
      if (!th) return;
      e.preventDefault();
      sortByHeader(th);
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
