<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#13171b">
  <title>{% block title %}Minervini Screener{% endblock %}</title>
  <!-- PWA(홈 화면 설치형 앱) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="미너비니">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Overpass:wght@500;600;700;800&family=Overpass+Mono:wght@400;500;600;700&display=swap">
  <style>
    :root {
      color-scheme: dark;   /* 스크롤바·select 목록·자동완성 등 브라우저 기본 UI도 다크로 */

      /* 랙(바탕) — 관제실 스트립 랙의 건메탈 */
      --bg: #13171b;
      --surface: #1b2025;
      --inset: #242a30;
      --border: #343c43;
      --line: #283038;
      --rail: #465059;

      /* 글자 (랙 위) */
      --text: #e3e6e8;
      --heading: #f6f7f7;
      --muted: #a2aab1;
      --faint: #8a939a;

      /* 비행 스트립 (인쇄 용지) */
      --strip: #e3e6e5;
      --strip-2: #d5d9d9;
      --strip-ink: #121518;
      --strip-ink-2: #464d54;
      --strip-rule: #b9bfc2;

      /* 차트 노트 (종목 상세만) — 미너비니 책의 손 주석 차트 용지 */
      --paper: #f3f2ec;
      --paper-2: #e8e7df;
      --paper-ink: #1d1d1b;
      --paper-ink-2: #4a4a46;
      --pencil: #62625d;
      --paper-rule: #d9d8cf;
      --paper-rule-2: #b9b8ae;
      --marker: #c0302a;       /* 빨강 마커: 손절·매도·미통과 */
      --highlight: #f6d743;    /* 형광펜: 매수 구간·적극 매수 */
      --pen: #2a549c;          /* 볼펜: 50일선 */
      --paper-green: #1c6636;
      --font-hand: 'Nanum Pen Script', 'Pretendard', cursive;

      /* 비행장 표지 — 노랑은 '안내·진행'. 인터랙션과 적극 매수에만 */
      --sign: #f2c200;
      --sign-ink: #0c0d0e;

      /* 상태 — 색은 상태에만 쓴다 */
      --go: #f2c200;          /* 적극 매수 홀더 */
      --buy: #b6bec4;         /* 대기 홀더(돌파 대기·눌림목) — 계약: 대기=회색 */
      --warn: #e5483d;        /* 매도 경고 홀더 */
      --hold: #8c959c;        /* 관심·데이터 점검 */
      --vfr: #3fb46a;         /* 국면: 매수 가능 */
      --mvfr: #4f95e6;        /* 국면: 선별 매수 */
      --ifr: #e5483d;         /* 국면: 매수 중지 */

      /* 기존 토큰 이름(다른 페이지·차트가 참조) */
      --accent: var(--sign);
      --accent-hover: #ffd53d;
      --accent-ink: var(--sign-ink);
      --accent-fill: var(--sign);
      --accent-fill-hover: #ffd53d;
      --green: #52c47a;
      --green-ink: #6ad08e;
      --red: #ef5a4f;
      --red-ink: #f06a60;
      --amber: #f2c200;
      --violet: #b98ad0;
      --orange: #f2a33a;
      --badge-green-bg: rgba(82,196,122,.14);
      --badge-red-bg: rgba(229,72,61,.15);
      --badge-gray-bg: rgba(255,255,255,.06);
      --badge-sign-bg: rgba(242,194,0,.10);
      --badge-violet-bg: rgba(185,138,208,.14);
      --header-bg: #0b0c0d;
      --row-hover: rgba(255,255,255,.035);

      --radius: 3px;
      --radius-sm: 2px;
      --gap: 14px;
      --shadow: 0 1px 0 rgba(0,0,0,.55), 0 3px 10px rgba(0,0,0,.32);

      --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
      --font-sign: 'Overpass', 'Pretendard', 'Segoe UI', sans-serif;
      --font-mono: 'Overpass Mono', 'D2Coding', 'Cascadia Code', Consolas, monospace;
      --font-verdict: 'Black Han Sans', 'Pretendard', sans-serif;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }

    /* 서버에서 계산된 상태색(신호·시장국면 등) */
    .tone-text { color: var(--tone-dark); }
    .tone-tint { background: color-mix(in srgb, var(--tone-dark) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tone-dark) 34%, transparent); }
    .tone-badge { background: color-mix(in srgb, var(--tone-dark) 14%, transparent); color: var(--tone-dark); border: 1px solid color-mix(in srgb, var(--tone-dark) 45%, transparent); }
    .code33-banner { background: color-mix(in srgb, var(--green) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--green) 38%, transparent); }

    /* ───── 기본 ───── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body); background: var(--bg); color: var(--text);
      min-height: 100vh; line-height: 1.55; -webkit-font-smoothing: antialiased;
      word-break: keep-all; overflow-wrap: break-word; font-variant-numeric: tabular-nums;
    }
    ::selection { background: var(--sign); color: var(--sign-ink); }
    :focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }
    a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    html { scrollbar-color: var(--rail) var(--bg); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--rail); border: 2px solid var(--bg); border-radius: 5px; }
    .num, .stat .v, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .ic { display: inline-block; vertical-align: -2px; flex-shrink: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ───── 상단 표지 바 (비행장 유도로 표지) ───── */
    header { background: var(--header-bg); border-bottom: 1px solid var(--rail); position: sticky; top: 0; z-index: 50; }
    .nav { max-width: 1180px; margin: 0 auto; padding: 10px 18px; display: flex; align-items: center; gap: 16px; }
    /* 위치 표지: 검정 바탕 · 노랑 글자 · 노랑 테 */
    .brand {
      display: inline-flex; align-items: center; gap: 9px; text-decoration: none; white-space: nowrap;
      background: var(--sign-ink); color: var(--sign); border: 2px solid var(--sign);
      padding: 6px 11px 5px; font-family: var(--font-sign); font-weight: 800; font-size: 0.95rem;
      letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;
    }
    .brand span { color: inherit; }
    .brand-mark { color: var(--sign); flex-shrink: 0; }
    .brand-sub { font-weight: 600; opacity: .72; }
    /* 방향 표지: 노랑 바탕 · 검정 글자 */
    .nav-links { display: flex; gap: 6px; align-items: center; }
    .nav-links a {
      display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 11px;
      background: var(--sign); color: var(--sign-ink); text-decoration: none;
      font-family: var(--font-sign); font-weight: 800; font-size: 0.86rem; letter-spacing: 0.02em;
      transition: background .15s;
    }
    .nav-links a:hover { background: #ffd53d; }
    .nav-links a[aria-current="page"] { background: var(--sign-ink); color: var(--sign); box-shadow: inset 0 0 0 2px var(--sign); }
    .nav-links svg { flex-shrink: 0; }
    .search { margin-left: auto; position: relative; }
    .search input {
      background: var(--inset); border: 1px solid var(--border); color: var(--text); height: 36px;
      padding: 0 40px 0 12px; border-radius: var(--radius); font-size: 0.88rem; width: 210px; font-family: var(--font-body);
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { outline: none; border-color: var(--sign); }
    .container { max-width: 1180px; margin: 0 auto; padding: 26px 18px 72px; }

    /* ───── 제목 (색 띠 대신 랙 레일) ───── */
    h2.page-title { font-family: var(--font-body); font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; color: var(--heading); line-height: 1.3; }
    .section-title, .sec-title {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      font-size: 1.12rem; font-weight: 800; letter-spacing: -0.01em; color: var(--heading);
      margin: 44px 0 14px; padding-top: 14px; border-top: 1px solid var(--rail);
    }
    .section-title .hint, .sec-title .sub { font-weight: 500; font-size: 0.84rem; color: var(--muted); }
    .note { color: var(--muted); font-size: 0.86rem; line-height: 1.7; }
    .note-sm { color: var(--faint); font-size: 0.8rem; line-height: 1.65; }

    /* ───── 판 · 칸 ───── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .stat { background: var(--surface); border: 1px solid var(--border); padding: 14px 15px; }
    .stat .k { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .stat .v { font-size: 1.12rem; font-weight: 600; color: var(--heading); }
    .stat-strip { display: flex; flex-wrap: wrap; margin-top: 12px; border-top: 1px solid var(--border); }
    .stat-strip-item { display: flex; flex-direction: column; gap: 4px; padding: 10px 20px 2px 0; margin-right: 20px; border-right: 1px solid var(--border); }
    .stat-strip-item:last-child { border-right: none; }
    .ss-label { font-size: 0.76rem; color: var(--muted); }
    .ss-val { font-size: 1.12rem; font-weight: 700; font-family: var(--font-mono); }

    /* ───── 도장(배지) ───── */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
    .badge-green { background: var(--badge-green-bg); color: var(--green-ink); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
    .badge-red { background: var(--badge-red-bg); color: var(--red-ink); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
    .badge-gray { background: var(--badge-gray-bg); color: var(--muted); border-color: var(--border); }
    .heat-chip { display: inline-block; padding: 2px 7px; border-radius: var(--radius-sm); font-weight: 700; text-align: center; font-family: var(--font-mono); font-size: 0.82rem; }

    .tavatar { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 0.76rem; font-weight: 700; flex-shrink: 0; overflow: hidden; }
    .tavatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 2px; }

    /* ───── 버튼 ───── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
      background: var(--inset); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius);
      padding: 0 16px; cursor: pointer; font-size: 0.9rem; font-weight: 700; font-family: var(--font-body);
      transition: border-color .15s, background .15s; -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { border-color: var(--sign); }
    .btn-fill { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
    .btn-fill:hover { background: #ffd53d; border-color: #ffd53d; }

    /* ───── 시장 탭 (위치 표지 / 방향 표지) ───── */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab {
      display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; text-decoration: none;
      background: var(--sign); color: var(--sign-ink); font-family: var(--font-sign); font-weight: 800; font-size: 0.9rem;
    }
    .tab:hover { background: #ffd53d; }
    .tab.active { background: var(--sign-ink); color: var(--sign); box-shadow: inset 0 0 0 2px var(--sign); }

    /* ───── 차트 · 레이아웃 ───── */
    .chart-row { display: grid; grid-template-columns: 7fr 3fr; gap: var(--gap); align-items: stretch; }
    .chart-side { display: flex; flex-direction: column; }
    .dash-row { display: grid; grid-template-columns: 1fr 1.6fr; gap: var(--gap); align-items: start; }
    @media (max-width: 900px) { .chart-row, .dash-row { grid-template-columns: 1fr; } }
    .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 0.8rem; color: var(--muted); align-items: center; }
    .chart-legend .sw { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
    .chart-legend .ln { display: inline-block; width: 14px; height: 3px; margin-right: 5px; vertical-align: 2px; }
    .chart-legend .ln.thick { height: 4px; }
    .chart-legend .ln.dash { height: 0; border-top: 2px dotted currentColor; background: none; }
    .sparkline { display: block; overflow: visible; }

    /* ───── 표 (인쇄된 일지) ───── */
    .table-wrap { border: 1px solid var(--border); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 9px 12px; background: var(--inset); color: var(--muted);
      font-size: 0.76rem; font-weight: 700; white-space: nowrap; border-bottom: 1px solid var(--rail);
      position: sticky; top: 57px; z-index: 5;
    }
    tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr[data-href] { cursor: pointer; }
    tbody tr:hover td { background: var(--row-hover); }
    tr.hot-row td { background: color-mix(in srgb, var(--sign) 7%, var(--surface)); }
    a.ticker-link { color: var(--heading); text-decoration: none; font-weight: 700; font-family: var(--font-mono); }
    a.ticker-link:hover { text-decoration: underline; text-decoration-color: var(--sign); }
    a.tv-link { display: inline-flex; align-items: center; justify-content: center; color: var(--faint); vertical-align: middle; padding: 10px 7px; margin: -10px -7px -10px 0; }
    a.tv-link:hover { color: var(--sign); }
    th.num, td.num { text-align: right; }
    th.ctr, td.ctr { text-align: center; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); }
    th.sortable::after { content: ''; display: inline-block; width: 10px; height: 10px; margin-left: 5px; vertical-align: -1px;
      background-color: currentColor; opacity: .45; -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='square'><path d='M7 9l5-5 5 5M7 15l5 5 5-5'/></svg>") center / contain no-repeat;
      mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='square'><path d='M7 9l5-5 5 5M7 15l5 5 5-5'/></svg>") center / contain no-repeat; }
    th.sortable[data-dir="asc"]::after { opacity: 1; background-color: var(--sign); -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='square'><path d='M6 15l6-6 6 6'/></svg>"); mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='square'><path d='M6 15l6-6 6 6'/></svg>"); }
    th.sortable[data-dir="desc"]::after { opacity: 1; background-color: var(--sign); -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='square'><path d='M6 9l6 6 6-6'/></svg>"); mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='square'><path d='M6 9l6 6 6-6'/></svg>"); }
    @media (min-width: 721px) {
      td.reason { max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
      td.reason[data-tt]:hover { overflow: visible; }
      td.reason[data-tt]:hover::after {
        content: attr(data-tt); position: absolute; left: 0; top: 100%; margin-top: 4px; z-index: 20;
        background: var(--strip); color: var(--strip-ink); padding: 9px 11px; font-size: 0.82rem; line-height: 1.5;
        white-space: normal; width: max-content; max-width: 320px; box-shadow: var(--shadow);
      }
    }
    @media (max-width: 720px) {
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: none; background: none; }
      table.cards { display: block; }
      table.cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      table.cards tbody { display: flex; flex-direction: column; gap: 8px; }
      table.cards tr { display: block; background: var(--surface); border: 1px solid var(--border); padding: 4px 14px; }
      table.cards tr:hover td { background: none; }
      table.cards td { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; text-align: right; }
      table.cards tr td:last-child { border-bottom: none; }
      table.cards td::before { content: attr(data-label); color: var(--muted); font-size: 0.8rem; font-weight: 500; text-align: left; white-space: nowrap; }
      table.cards td[data-label=""]::before { content: none; }
      table.cards td.stack { flex-direction: column; align-items: stretch; text-align: left; gap: 4px; }
    }

    /* ───── 빈 슬롯 · 로딩 ───── */
    .empty-state {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 18px 20px;
      border: 1px dashed var(--rail); color: var(--muted);
    }
    .empty-state svg { display: none; }
    .empty-state .msg { font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .empty-state .sub { font-size: 0.84rem; color: var(--muted); }
    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--inset) 50%, var(--surface) 75%); background-size: 200% 100%; animation: skeleton-pulse 1.4s ease-in-out infinite; }
    @keyframes skeleton-pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ───── 커맨드 팔레트 (⌘K) ───── */
    .cmdk-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: flex-start; justify-content: center; padding-top: 12vh; }
    .cmdk-overlay.open { display: flex; }
    .cmdk-modal { background: var(--surface); width: 92%; max-width: 500px; max-height: 60vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.5); overflow: hidden; }
    .cmdk-input { background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); padding: 15px 16px; font-size: 1rem; outline: none; width: 100%; font-family: var(--font-body); }
    .cmdk-results { overflow-y: auto; padding: 6px; }
    .cmdk-item { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 10px; cursor: pointer; font-size: 0.9rem; }
    .cmdk-item.active, .cmdk-item:hover { background: var(--inset); box-shadow: inset 2px 0 0 var(--sign); }
    .cmdk-item .t { font-weight: 700; color: var(--heading); font-family: var(--font-mono); flex-shrink: 0; }
    .cmdk-item .n { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmdk-item .m { color: var(--faint); font-size: 0.78rem; flex-shrink: 0; }
    .cmdk-empty { padding: 20px; text-align: center; color: var(--muted); font-size: 0.9rem; }
    .cmdk-section-label { padding: 8px 10px 4px; font-size: 0.76rem; color: var(--faint); font-weight: 700; }
    .cmdk-hint { display: inline-flex; align-items: center; padding: 1px 6px; border: 1px solid var(--border); font-size: 0.76rem; color: var(--faint); font-family: var(--font-mono); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }

    /* ───── 반응형 헤더 ───── */
    @media (max-width: 720px) {
      .nav { padding: 9px 14px; gap: 8px; flex-wrap: wrap; }
      .brand { font-size: 0.85rem; }
      .brand-sub { display: none; }
      .nav-links { order: 3; flex: 1 1 100%; }
      .nav-links a { flex: 1; justify-content: center; min-height: 40px; }
      .search { margin-left: auto; }
      .search input { width: 150px; }
      .container { padding: 18px 14px 56px; }
      h2.page-title { font-size: 1.3rem; }
      thead th { top: 104px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <nav class="nav" aria-label="주 메뉴">
      <a class="brand" href="/" aria-label="Minervini Screener 홈">
        <svg class="brand-mark" width="24" height="17" viewBox="0 0 28 20" fill="none" aria-hidden="true">
          <path d="M1,11 Q4,2 7,11 Q10,4 13,11 Q15,7 17,11 L25,3" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
          <path d="M19,3 L25,3 L25,9" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
        </svg>
        <span>Minervini</span><span class="brand-sub">Screener</span>
      </a>
      {% set path = request.url.path if request is defined else '' %}
      <div class="nav-links">
        <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>오늘의 판정</a>
        <a href="/vcp" {% if path.startswith('/vcp') %}aria-current="page"{% endif %} title="VCP(변동성 축소 패턴) 형성·돌파·실패 이력">VCP 일지</a>
        <a href="/alerts" {% if path.startswith('/alerts') %}aria-current="page"{% endif %}>알림</a>
      </div>
      <form class="search" action="/search" method="get" role="search">
        <input name="ticker" placeholder="티커 검색" autocomplete="off" aria-label="티커 검색">
        <span class="cmdk-hint">⌘K</span>
      </form>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <div class="cmdk-overlay" id="cmdkOverlay">
    <div class="cmdk-modal">
      <input type="text" id="cmdkInput" class="cmdk-input" placeholder="티커 또는 회사명 검색... (Esc로 닫기)" autocomplete="off">
      <div class="cmdk-results" id="cmdkResults"></div>
    </div>
  </div>
  <script>
    // 표 행 전체 클릭 시 이동 (data-href 지정된 tr만) — 링크/버튼 클릭은 그대로 두어 중복 방지
    document.addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-href]');
      if (tr && !e.target.closest('a, button')) location.href = tr.dataset.href;
    });
    // 정렬 헤더 접근성: 키보드 포커스 가능 + 스크린리더용 role/aria-sort 부여
    Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function (h) {
      h.setAttribute('tabindex', '0');
      h.setAttribute('role', 'button');
      h.setAttribute('aria-sort', 'none');
    });
    // 헤더 클릭/Enter·Space → 컬럼 정렬 (th.sortable + 같은 열 td[data-sort] 필요)
    function sortByHeader(th) {
      var table = th.closest('table');
      var tbody = table.querySelector('tbody');
      if (!tbody) return;
      var idx = Array.prototype.indexOf.call(th.parentNode.children, th);
      var asc = th.getAttribute('data-dir') !== 'asc';
      Array.prototype.forEach.call(table.querySelectorAll('th.sortable'), function (h) {
        h.removeAttribute('data-dir'); h.setAttribute('aria-sort', 'none');
      });
      th.setAttribute('data-dir', asc ? 'asc' : 'desc');
      th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
      var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
      rows.sort(function (ra, rb) {
        var av = ra.children[idx] ? ra.children[idx].getAttribute('data-sort') : null;
        var bv = rb.children[idx] ? rb.children[idx].getAttribute('data-sort') : null;
        var an = parseFloat(av), bn = parseFloat(bv);
        var cmp = (!isNaN(an) && !isNaN(bn)) ? (an - bn) : String(av || '').localeCompare(String(bv || ''), 'ko');
        return asc ? cmp : -cmp;
      });
      rows.forEach(function (r) { tbody.appendChild(r); });
    }
    document.addEventListener('click', function (e) {
      var th = e.target.closest('th.sortable');
      if (th) sortByHeader(th);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var th = e.target.closest('th.sortable');
      if (!th) return;
      e.preventDefault();
      sortByHeader(th);
    });

    // ───── 커맨드 팔레트 (⌘K / Ctrl+K) ─────
    (function () {
      var overlay = document.getElementById('cmdkOverlay');
      var modalInput = document.getElementById('cmdkInput');
      var results = document.getElementById('cmdkResults');
      var navInput = document.querySelector('.search input');
      if (!overlay || !modalInput || !results) return;

      var items = [];
      var activeIndex = -1;
      var debounceTimer = null;

      var QUICK_NAV = [
        { label: '홈 — 오늘의 스크리닝', href: '/' },
        { label: 'VCP 레지스트리', href: '/vcp' },
        { label: '이메일 알림', href: '/alerts' }
      ];

      function openPalette() {
        overlay.classList.add('open');
        modalInput.value = '';
        renderQuickNav();
        setTimeout(function () { modalInput.focus(); }, 0);
      }
      function closePalette() {
        overlay.classList.remove('open');
        clearTimeout(debounceTimer);
      }
      function collectItems() {
        items = Array.prototype.slice.call(results.querySelectorAll('.cmdk-item'));
        activeIndex = -1;
      }
      function renderQuickNav() {
        results.innerHTML = '<div class="cmdk-section-label">바로가기</div>';
        QUICK_NAV.forEach(function (q) {
          var el = document.createElement('div');
          el.className = 'cmdk-item';
          el.innerHTML = '<span class="n">' + q.label + '</span>';
          el.addEventListener('click', function () { location.href = q.href; });
          results.appendChild(el);
        });
        collectItems();
      }
      function renderResults(list) {
        if (!list.length) {
          results.innerHTML = '<div class="cmdk-empty">일치 종목 없음</div>';
          items = []; activeIndex = -1;
          return;
        }
        results.innerHTML = '<div class="cmdk-section-label">종목</div>';
        list.forEach(function (s) {
          var el = document.createElement('div');
          el.className = 'cmdk-item';
          var tEl = document.createElement('span'); tEl.className = 't'; tEl.textContent = s.ticker || '';
          var nEl = document.createElement('span'); nEl.className = 'n'; nEl.textContent = s.name || '';
          var mEl = document.createElement('span'); mEl.className = 'm'; mEl.textContent = s.market || '';
          el.appendChild(tEl); el.appendChild(nEl); el.appendChild(mEl);
          el.addEventListener('click', function () { location.href = '/stock/' + encodeURIComponent(s.ticker); });
          results.appendChild(el);
        });
        collectItems();
      }
      function setActive(idx) {
        items.forEach(function (el) { el.classList.remove('active'); });
        if (idx >= 0 && idx < items.length) {
          items[idx].classList.add('active');
          items[idx].scrollIntoView({ block: 'nearest' });
        }
        activeIndex = idx;
      }

      var searchSeq = 0;
      modalInput.addEventListener('input', function () {
        var q = modalInput.value.trim();
        clearTimeout(debounceTimer);
        if (!q) { renderQuickNav(); return; }
        var seq = ++searchSeq;
        debounceTimer = setTimeout(function () {
          fetch('/api/search-tickers?q=' + encodeURIComponent(q))
            .then(function (r) { return r.json(); })
            .then(function (d) { if (seq === searchSeq) renderResults(d.results || []); })
            .catch(function () { if (seq === searchSeq) renderResults([]); });
        }, 150);
      });

      modalInput.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(activeIndex + 1, items.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(activeIndex - 1, 0)); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          if (activeIndex >= 0 && items[activeIndex]) items[activeIndex].click();
          else if (items.length === 1) items[0].click();
        } else if (e.key === 'Escape') { closePalette(); }
      });

      overlay.addEventListener('click', function (e) { if (e.target === overlay) closePalette(); });

      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          openPalette();
        }
      });

      if (navInput) {
        navInput.addEventListener('focus', function (e) {
          e.target.blur();
          openPalette();
        });
      }
    })();
  </script>
  <script>
    // 설치형 PWA: 서비스워커 등록 (오프라인 폴백 + 정적 자원 캐시)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
