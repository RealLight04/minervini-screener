<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" id="themeColorMeta">
  <title>{% block title %}Minervini Screener{% endblock %}</title>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search).get('theme');
      if (qs === 'dark' || qs === 'light') localStorage.setItem('theme', qs);
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root, :root[data-theme="light"] {
      --bg: #ffffff;
      --surface: #ffffff;
      --inset: #f0f3fa;
      --border: #e0e3eb;
      --line: #eceef2;
      --text: #131722;
      --muted: #787b86;
      --faint: #9598a1;
      --accent: #2962ff;
      --accent-ink: #ffffff;
      --green: #089981;
      --green-ink: #089981;
      --red: #f23645;
      --red-ink: #f23645;
      --amber: #ff9800;
      --violet: #7e57c2;
      --orange: #fb8c00;
      --badge-green-bg: rgba(8,153,129,.10);
      --badge-red-bg: rgba(242,54,69,.10);
      --badge-gray-bg: #eef0f5;
      --badge-blue-bg: rgba(41,98,255,.09);
      --badge-violet-bg: rgba(126,87,194,.10);
      --header-bg: rgba(255,255,255,.92);
      --row-hover: rgba(41,98,255,.04);
      --radius: 4px;
      --radius-sm: 3px;
      --gap: 14px;
      --shadow: none;
    }
    :root[data-theme="dark"] {
      --bg: #131722;
      --surface: #1e222d;
      --inset: #2a2e39;
      --border: #2a2e39;
      --line: #262b38;
      --text: #d1d4dc;
      --muted: #787b86;
      --faint: #5d606b;
      --accent: #2962ff;
      --accent-ink: #ffffff;
      --green: #26a69a;
      --green-ink: #26a69a;
      --red: #ef5350;
      --red-ink: #ef5350;
      --amber: #ffa726;
      --violet: #9b7fd4;
      --orange: #ffa726;
      --badge-green-bg: rgba(38,166,154,.15);
      --badge-red-bg: rgba(239,83,80,.15);
      --badge-gray-bg: rgba(255,255,255,.06);
      --badge-blue-bg: rgba(41,98,255,.16);
      --badge-violet-bg: rgba(155,127,212,.15);
      --header-bg: rgba(19,23,34,.95);
      --row-hover: rgba(255,255,255,.035);
      --radius: 4px;
      --radius-sm: 3px;
      --gap: 14px;
      --shadow: none;
    }
    /* 서버에서 계산된 상태색(신호·시장국면 등)을 라이트/다크 모드에 맞게 전환하는 유틸 */
    .tone-text { color: var(--tone-light); }
    .tone-tint { background: color-mix(in srgb, var(--tone-light) 13%, var(--surface)); border-color: color-mix(in srgb, var(--tone-light) 38%, transparent); }
    .tone-badge { background: color-mix(in srgb, var(--tone-light) 16%, var(--surface)); color: var(--tone-light); border: 1px solid color-mix(in srgb, var(--tone-light) 45%, transparent); }
    :root[data-theme="dark"] .tone-text { color: var(--tone-dark); }
    :root[data-theme="dark"] .tone-tint { background: color-mix(in srgb, var(--tone-dark) 13%, var(--surface)); border-color: color-mix(in srgb, var(--tone-dark) 38%, transparent); }
    :root[data-theme="dark"] .tone-badge { background: color-mix(in srgb, var(--tone-dark) 16%, var(--surface)); color: var(--tone-dark); border-color: color-mix(in srgb, var(--tone-dark) 45%, transparent); }
    .code33-banner { background: linear-gradient(90deg, var(--badge-green-bg), color-mix(in srgb, var(--green) 22%, var(--surface))); border: 1px solid color-mix(in srgb, var(--green) 40%, transparent); }

    /* ───── 통계 스트립 (TradingView식 밀도있는 숫자 리드아웃) ───── */
    .stat-strip { display: flex; gap: 0; flex-wrap: wrap; margin-top: 12px; border-top: 1px solid var(--border); }
    .stat-strip-item {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 20px 2px 0; margin-right: 20px; border-right: 1px solid var(--border);
    }
    .stat-strip-item:last-child { border-right: none; margin-right: 0; }
    .ss-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .ss-val { font-size: 1.15rem; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

    /* ───── 스파크라인 ───── */
    .sparkline { display: block; overflow: visible; }

    /* ───── 커맨드 팔레트 (⌘K) ───── */
    .cmdk-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 100; align-items: flex-start; justify-content: center; padding-top: 12vh;
    }
    .cmdk-overlay.open { display: flex; }
    .cmdk-modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      width: 92%; max-width: 480px; max-height: 60vh; display: flex; flex-direction: column;
      box-shadow: 0 8px 30px rgba(0,0,0,.35); overflow: hidden;
    }
    .cmdk-input {
      background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text);
      padding: 14px 16px; font-size: 0.95rem; outline: none; width: 100%; font-family: var(--font-body);
    }
    .cmdk-results { overflow-y: auto; padding: 6px; }
    .cmdk-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.86rem;
    }
    .cmdk-item.active, .cmdk-item:hover { background: var(--row-hover); }
    .cmdk-item .t { font-weight: 700; color: var(--accent); font-family: var(--font-mono); flex-shrink: 0; }
    .cmdk-item .n { color: var(--muted); font-size: 0.8rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmdk-item .m { color: var(--faint); font-size: 0.7rem; flex-shrink: 0; }
    .cmdk-empty { padding: 20px; text-align: center; color: var(--faint); font-size: 0.85rem; }
    .cmdk-section-label { padding: 8px 10px 4px; font-size: 0.68rem; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
    .cmdk-hint {
      display: inline-flex; align-items: center; padding: 1px 6px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.68rem; color: var(--faint); font-family: var(--font-mono);
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none;
    }

    /* ───── 빈 상태 ───── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 36px 20px; border: 1px dashed var(--border); border-radius: var(--radius);
      color: var(--faint); text-align: center;
    }
    .empty-state svg { opacity: .35; }
    .empty-state .msg { font-size: 0.85rem; color: var(--muted); }
    .empty-state .sub { font-size: 0.76rem; color: var(--faint); }

    /* ───── 로딩 스켈레톤 ───── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--inset) 50%, var(--surface) 75%);
      background-size: 200% 100%; animation: skeleton-pulse 1.4s ease-in-out infinite;
    }
    @keyframes skeleton-pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    :root {
      --font-body: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard',
                   'Malgun Gothic', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-mono: 'SF Mono', 'Cascadia Code', 'D2Coding', Consolas, 'Liberation Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.003em;
      font-variant-numeric: tabular-nums;
    }
    /* 금융 수치: 자릿수 정렬 + 터미널 느낌의 모노스페이스 */
    .num, .stat .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ───── 헤더 ───── */
    header {
      background: var(--header-bg);
      backdrop-filter: saturate(160%) blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .nav {
      max-width: 1120px; margin: 0 auto;
      padding: 12px 18px;
      display: flex; align-items: center; gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 1.15rem; font-weight: 800; color: var(--text); text-decoration: none; white-space: nowrap; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }
    .brand-mark { color: var(--accent); flex-shrink: 0; }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color .15s; }
    .nav a:hover { color: var(--text); }
    .search { margin-left: auto; position: relative; }
    .search input {
      background: var(--inset); border: 1px solid var(--border); color: var(--text);
      padding: 8px 36px 8px 32px; border-radius: var(--radius); font-size: 0.88rem; width: 200px;
      transition: border-color .15s, width .2s;
    }
    .search input:focus { outline: none; border-color: var(--accent); }
    .search::before {
      content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 0.8rem; opacity: .6; pointer-events: none;
    }

    .container { max-width: 1120px; margin: 0 auto; padding: 26px 18px 64px; }

    /* ───── 타이포 ───── */
    h2.page-title { font-family: var(--font-body); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .section-title {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      font-size: 1.08rem; font-weight: 730; margin: 32px 0 14px; letter-spacing: -0.01em;
      padding-left: 11px; border-left: 3px solid currentColor;
    }
    .section-title .hint { font-weight: 400; font-size: 0.82rem; color: var(--faint); }
    .section-title .hint::before { content: ": "; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }

    /* ───── 종목 상세: 섹션 제목·설명·지표카드 (가독성 표준) ───── */
    .sec-title {
      display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
      font-size: 1.05rem; font-weight: 720; color: var(--text);
      letter-spacing: -0.01em; margin: 32px 0 14px; padding-left: 11px;
      border-left: 3px solid var(--accent);
    }
    .sec-title .sub { font-weight: 400; font-size: 0.8rem; color: var(--faint); }
    .sec-title .sub::before { content: ": "; }
    .note { color: var(--muted); font-size: 0.82rem; line-height: 1.7; }
    .note-sm { color: var(--faint); font-size: 0.78rem; line-height: 1.65; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 11px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 15px; }
    .stat .k { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .stat .v { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.01em; }

    /* ───── 카드 ───── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
    }

    /* ───── 배지 / 칩 ───── */
    .badge { display: inline-block; padding: 3px 9px; border-radius: var(--radius-sm); font-size: 0.74rem; font-weight: 650; white-space: nowrap; }
    .heat-chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 650; text-align: center; }
    .badge-green { background: var(--badge-green-bg); color: var(--green-ink); }
    .badge-red { background: var(--badge-red-bg); color: var(--red-ink); }
    .badge-gray { background: var(--badge-gray-bg); color: var(--muted); }

    /* ───── 버튼 ───── */
    .btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 8px 15px; cursor: pointer; font-size: 0.86rem; font-weight: 550;
      transition: border-color .15s, background .15s; -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { border-color: var(--accent); }

    /* ───── 탭 (TradingView식 플랫 언더라인) ───── */
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab {
      text-decoration: none; padding: 9px 14px; font-size: 0.86rem; font-weight: 600;
      color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ───── 차트 + 사이드 패널 (비대칭 70/30) ───── */
    .chart-row { display: grid; grid-template-columns: 7fr 3fr; gap: var(--gap); align-items: stretch; }
    .chart-side { display: flex; flex-direction: column; }
    @media (max-width: 900px) {
      .chart-row { grid-template-columns: 1fr; }
    }

    /* ───── 대시보드 위젯 행 (홈: 시장국면 + 주도섹터 나란히) ───── */
    .dash-row { display: grid; grid-template-columns: 1fr 1.6fr; gap: var(--gap); align-items: start; }
    @media (max-width: 900px) {
      .dash-row { grid-template-columns: 1fr; }
    }

    /* ───── 차트 범례 ───── */
    .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 0.76rem; color: var(--muted); align-items: center; }
    .chart-legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .chart-legend .ln { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 2px; }
    .chart-legend .ln.thick { height: 4px; }
    .chart-legend .ln.dash { height: 0; border-top: 2px dotted currentColor; background: none; }

    /* ───── 테이블 ───── */
    /* overflow-x:auto는 세로축도 auto로 만들어 sticky thead를 이 래퍼 기준으로 깨뜨리므로,
       가로 스크롤이 실제 필요한(그리고 thead가 안 보여 sticky도 무관한) 모바일 폭에서만 적용 */
    .table-wrap { border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 8px 12px; background: var(--inset); color: var(--muted);
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      white-space: nowrap; border-bottom: 1px solid var(--border);
      position: sticky; top: 58px; z-index: 5;
    }
    tbody td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 0.87rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .12s; }
    tbody tr[data-href] { cursor: pointer; }
    tbody tr:hover td { background: var(--row-hover); }
    tr.hot-row td { background: color-mix(in srgb, var(--amber) 14%, var(--surface)); }
    a.ticker-link { color: var(--accent); text-decoration: none; font-weight: 650; }
    a.ticker-link:hover { text-decoration: underline; }
    a.tv-link {
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--faint); vertical-align: middle; transition: color .15s;
      padding: 10px 7px; margin: -10px -7px -10px 0px; /* 시각적 크기는 유지하고 탭 영역만 확장 */
    }
    a.tv-link:hover { color: var(--accent); }
    th.num, td.num { text-align: right; }
    th.ctr, td.ctr { text-align: center; }

    /* 정렬 가능한 헤더 */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); }
    th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    th.sortable::after { content: '↕'; margin-left: 4px; opacity: .4; font-size: 0.85em; }
    th.sortable[data-dir="asc"]::after { content: '▲'; opacity: 1; color: var(--accent); }
    th.sortable[data-dir="desc"]::after { content: '▼'; opacity: 1; color: var(--accent); }

    /* '근거' 등 긴 텍스트 셀 — 데스크톱은 말줄임 + 호버 툴팁, 모바일(.stack)은 그대로 전체 표시 */
    @media (min-width: 721px) {
      td.reason { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
      td.reason[data-tt]:hover { overflow: visible; }
      td.reason[data-tt]:hover::after {
        content: attr(data-tt);
        position: absolute; left: 0; top: 100%; margin-top: 4px; z-index: 20;
        background: var(--text); color: var(--bg); padding: 9px 11px; border-radius: 6px;
        font-size: 0.78rem; line-height: 1.5; white-space: normal; width: max-content; max-width: 320px;
        box-shadow: var(--shadow); font-family: var(--font-body);
      }
    }

    /* 모바일: 테이블 → 카드 스택 */
    @media (max-width: 720px) {
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table.cards { display: block; }
      table.cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      table.cards tbody { display: flex; flex-direction: column; gap: 11px; }
      table.cards tr {
        display: block; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 6px 15px;
      }
      table.cards tr:hover td { background: none; }
      table.cards td {
        display: flex; justify-content: space-between; align-items: center; gap: 14px;
        padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; text-align: right;
      }
      table.cards tr td:last-child { border-bottom: none; }
      table.cards td::before {
        content: attr(data-label); color: var(--muted); font-size: 0.78rem; font-weight: 500;
        text-align: left; white-space: nowrap; letter-spacing: 0;
      }
      table.cards td[data-label=""]::before { content: none; }
      /* 근거처럼 긴 텍스트 셀은 세로로 */
      table.cards td.stack { flex-direction: column; align-items: stretch; text-align: left; gap: 4px; }
    }

    /* ───── 반응형 헤더 ───── */
    /* 로고+토글은 1행에 남기고, nav-links·검색창은 각각 전체 폭의 독립된 행으로 내림
       (flex-wrap의 아이템 단위 줄바꿈에 맡기면 폭 계산이 어긋나 가로 스크롤이 생길 수 있어 flex-basis:100%로 강제) */
    @media (max-width: 600px) {
      .nav { padding: 11px 15px; gap: 10px; flex-wrap: wrap; }
      .brand { font-size: 1.05rem; }
      .nav-links { gap: 14px; order: 3; flex: 1 1 100%; }
      .search { margin-left: 0; order: 4; flex: 1 1 100%; }
      .search input { width: 100%; }
      .search input:focus { width: 100%; }
      .container { padding: 20px 14px 56px; }
      h2.page-title { font-size: 1.3rem; }
      .section-title { margin: 26px 0 12px; }
    }

    /* ───── 다크모드 토글 ───── */
    .theme-toggle {
      background: var(--inset); border: 1px solid var(--border); color: var(--text);
      width: 34px; height: 34px; border-radius: var(--radius); cursor: pointer; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent; transition: border-color .15s;
    }
    .theme-toggle:hover { border-color: var(--accent); }
    :root[data-theme="dark"] .theme-toggle .i-light,
    :root:not([data-theme="dark"]) .theme-toggle .i-dark { display: none; }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="/">
        <svg class="brand-mark" width="26" height="18" viewBox="0 0 28 20" fill="none" aria-hidden="true">
          <path d="M1,11 Q4,2 7,11 Q10,4 13,11 Q15,7 17,11 L25,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19,3 L25,3 L25,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
        </svg>
        <span>Minervini</span> Screener
      </a>
      <div class="nav-links">
        <a href="/">홈</a>
        <a href="/vcp" title="VCP(Volatility Contraction Pattern) — 변동성 축소 패턴 레지스트리">VCP</a>
        <a href="/alerts">알림</a>
      </div>
      <form class="search" action="/search" method="get">
        <input name="ticker" placeholder="티커 검색" autocomplete="off" aria-label="티커 검색">
        <span class="cmdk-hint">⌘K</span>
      </form>
      <button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="다크모드 전환" title="라이트/다크 모드 전환">
        <span class="i-dark">🌙</span><span class="i-light">☀️</span>
      </button>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <div class="cmdk-overlay" id="cmdkOverlay">
    <div class="cmdk-modal">
      <input type="text" id="cmdkInput" class="cmdk-input" placeholder="티커 또는 회사명 검색... (Esc로 닫기)" autocomplete="off">
      <div class="cmdk-results" id="cmdkResults"></div>
    </div>
  </div>
  <script>
    function toggleTheme() {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      // 캔들 차트(lightweight-charts)는 CSS가 아니라 JS로 그려서, 새로고침으로 확실히 다시 그림
      location.reload();
    }
    (function () {
      var meta = document.getElementById('themeColorMeta');
      var theme = document.documentElement.getAttribute('data-theme');
      if (meta && theme === 'dark') meta.setAttribute('content', '#131722');
    })();
    // 표 행 전체 클릭 시 이동 (data-href 지정된 tr만) — 링크/버튼 클릭은 그대로 두어 중복 방지
    document.addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-href]');
      if (tr && !e.target.closest('a, button')) location.href = tr.dataset.href;
    });
    // 정렬 헤더 접근성: 키보드 포커스 가능 + 스크린리더용 role/aria-sort 부여
    Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function (h) {
      h.setAttribute('tabindex', '0');
      h.setAttribute('role', 'button');
      h.setAttribute('aria-sort', 'none');
    });
    // 헤더 클릭/Enter·Space → 컬럼 정렬 (th.sortable + 같은 열 td[data-sort] 필요)
    function sortByHeader(th) {
      var table = th.closest('table');
      var tbody = table.querySelector('tbody');
      if (!tbody) return;
      var idx = Array.prototype.indexOf.call(th.parentNode.children, th);
      var asc = th.getAttribute('data-dir') !== 'asc';
      Array.prototype.forEach.call(table.querySelectorAll('th.sortable'), function (h) {
        h.removeAttribute('data-dir'); h.setAttribute('aria-sort', 'none');
      });
      th.setAttribute('data-dir', asc ? 'asc' : 'desc');
      th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
      var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
      rows.sort(function (ra, rb) {
        var av = ra.children[idx] ? ra.children[idx].getAttribute('data-sort') : null;
        var bv = rb.children[idx] ? rb.children[idx].getAttribute('data-sort') : null;
        var an = parseFloat(av), bn = parseFloat(bv);
        var cmp = (!isNaN(an) && !isNaN(bn)) ? (an - bn) : String(av || '').localeCompare(String(bv || ''), 'ko');
        return asc ? cmp : -cmp;
      });
      rows.forEach(function (r) { tbody.appendChild(r); });
    }
    document.addEventListener('click', function (e) {
      var th = e.target.closest('th.sortable');
      if (th) sortByHeader(th);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var th = e.target.closest('th.sortable');
      if (!th) return;
      e.preventDefault();
      sortByHeader(th);
    });

    // ───── 커맨드 팔레트 (⌘K / Ctrl+K) ─────
    (function () {
      var overlay = document.getElementById('cmdkOverlay');
      var modalInput = document.getElementById('cmdkInput');
      var results = document.getElementById('cmdkResults');
      var navInput = document.querySelector('.search input');
      if (!overlay || !modalInput || !results) return;

      var items = [];
      var activeIndex = -1;
      var debounceTimer = null;

      var QUICK_NAV = [
        { label: '홈 — 오늘의 스크리닝', href: '/' },
        { label: 'VCP 레지스트리', href: '/vcp' },
        { label: '이메일 알림', href: '/alerts' }
      ];

      function openPalette() {
        overlay.classList.add('open');
        modalInput.value = '';
        renderQuickNav();
        setTimeout(function () { modalInput.focus(); }, 0);
      }
      function closePalette() {
        overlay.classList.remove('open');
        clearTimeout(debounceTimer);
      }
      function collectItems() {
        items = Array.prototype.slice.call(results.querySelectorAll('.cmdk-item'));
        activeIndex = -1;
      }
      function renderQuickNav() {
        results.innerHTML = '<div class="cmdk-section-label">바로가기</div>';
        QUICK_NAV.forEach(function (q) {
          var el = document.createElement('div');
          el.className = 'cmdk-item';
          el.innerHTML = '<span class="n">' + q.label + '</span>';
          el.addEventListener('click', function () { location.href = q.href; });
          results.appendChild(el);
        });
        collectItems();
      }
      function renderResults(list) {
        if (!list.length) {
          results.innerHTML = '<div class="cmdk-empty">일치하는 종목이 없습니다.</div>';
          items = []; activeIndex = -1;
          return;
        }
        results.innerHTML = '<div class="cmdk-section-label">종목</div>';
        list.forEach(function (s) {
          var el = document.createElement('div');
          el.className = 'cmdk-item';
          var tEl = document.createElement('span'); tEl.className = 't'; tEl.textContent = s.ticker || '';
          var nEl = document.createElement('span'); nEl.className = 'n'; nEl.textContent = s.name || '';
          var mEl = document.createElement('span'); mEl.className = 'm'; mEl.textContent = s.market || '';
          el.appendChild(tEl); el.appendChild(nEl); el.appendChild(mEl);
          el.addEventListener('click', function () { location.href = '/stock/' + encodeURIComponent(s.ticker); });
          results.appendChild(el);
        });
        collectItems();
      }
      function setActive(idx) {
        items.forEach(function (el) { el.classList.remove('active'); });
        if (idx >= 0 && idx < items.length) {
          items[idx].classList.add('active');
          items[idx].scrollIntoView({ block: 'nearest' });
        }
        activeIndex = idx;
      }

      var searchSeq = 0;
      modalInput.addEventListener('input', function () {
        var q = modalInput.value.trim();
        clearTimeout(debounceTimer);
        if (!q) { renderQuickNav(); return; }
        var seq = ++searchSeq;
        debounceTimer = setTimeout(function () {
          fetch('/api/search-tickers?q=' + encodeURIComponent(q))
            .then(function (r) { return r.json(); })
            .then(function (d) { if (seq === searchSeq) renderResults(d.results || []); })
            .catch(function () { if (seq === searchSeq) renderResults([]); });
        }, 150);
      });

      modalInput.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(activeIndex + 1, items.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(activeIndex - 1, 0)); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          if (activeIndex >= 0 && items[activeIndex]) items[activeIndex].click();
          else if (items.length === 1) items[0].click();
        } else if (e.key === 'Escape') { closePalette(); }
      });

      overlay.addEventListener('click', function (e) { if (e.target === overlay) closePalette(); });

      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          openPalette();
        }
      });

      if (navInput) {
        navInput.addEventListener('focus', function (e) {
          e.target.blur();
          openPalette();
        });
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
