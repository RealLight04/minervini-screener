name: Daily data refresh

# 각 시장 '마감 직후' 당일 최신화한다.
# GitHub 스케줄은 20~60분 지연 실행되므로, 마감 시각 정각에 걸어두면
# 실제 실행은 자연히 마감 뒤가 되어 당일 종가가 확보된다.
#
#  - 06:50 UTC (15:50 KST, 한국장 마감 후)        : 한국 전용 런 → 당일 오후 코스피/코스닥 최신화
#  - 20:20 UTC (미국장 마감 후·서머타임 EDT)      : 풀 런 — 뉴욕이 EDT일 때만 실행
#  - 21:20 UTC (미국장 마감 후·표준시 EST)        : 풀 런 — 뉴욕이 EST일 때만 실행
#    → 서머타임 전환은 'Decide run mode' 스텝이 자동 판정(수동 변경 불필요)
#
# 풀 런 = 미국 수집 + 한국 재수집 + EPS 백필 + 재스크린. 한국 런 = 한국 수집 + 재스크린.
# 갱신된 screener.db 스냅샷을 커밋·push하면 Render가 재배포, 그램은 30분 타이머로 pull.

on:
  workflow_dispatch:         # 수동 실행 버튼 (풀 런)
  schedule:
    - cron: "50 6 * * 1-5"   # 한국장 마감 후 (15:50 KST) — 한국 전용 (주말 제외)
    - cron: "20 20 * * 1-5"  # 미국장 마감 후 (EDT, 3~11월) — 풀 런
    - cron: "20 21 * * 1-5"  # 미국장 마감 후 (EST, 11~3월) — 풀 런

# 동시 실행 방지(이전 런이 끝나기 전 새 런이 겹치지 않게)
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write            # screener.db 커밋·push 권한

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Decide run mode (kr / full / skip)
        id: mode
        run: |
          MODE=full   # workflow_dispatch(수동) 기본 = 풀 런
          NY=$(TZ=America/New_York date +%z)   # -0400=EDT(서머타임) / -0500=EST(표준시)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "50 6 * * 1-5") MODE=kr ;;                                    # 한국장 마감 런
              "20 20 * * 1-5") [ "$NY" = "-0400" ] && MODE=full || MODE=skip ;;  # EDT일 때만
              "20 21 * * 1-5") [ "$NY" = "-0500" ] && MODE=full || MODE=skip ;;  # EST일 때만
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "run mode: $MODE (NY offset: $NY)"

      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode != 'skip'

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.mode.outputs.mode != 'skip'
        # finance-datareader는 한국 종목 수집에만 필요(서버 requirements에는 제외돼 있음)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt finance-datareader

      - name: Collect US data + screen
        if: steps.mode.outputs.mode == 'full'
        run: python scripts/daily_update.py

      - name: Collect KR data + screen
        if: steps.mode.outputs.mode != 'skip'
        run: python scripts/collect_kr.py

      - name: Backfill US quarterly EPS history (Alpha Vantage)
        # 미국 관심권 종목의 분기 EPS 이력을 채워 '3분기 연속 EPS YoY' 판정을 가능케 한다.
        # 무료 키는 하루 25건이라 미완성 종목을 매일 점진 완성(skip 로직). 한도/실패해도
        # 파이프라인 전체는 계속 진행(continue-on-error).
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/backfill_eps.py --limit 25

      - name: Recompute YoY growth (network-free)
        # DB에 누적된 분기 재무로 매출·영업이익·EPS의 YoY를 재계산(날짜 매칭).
        if: steps.mode.outputs.mode != 'skip'
        run: python scripts/recompute_yoy.py

      - name: Commit refreshed snapshot DB & trigger Render deploy
        if: steps.mode.outputs.mode != 'skip'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener.db
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋·배포 건너뜀(데이터가 갱신되지 않았거나 수집 실패)"
            exit 0
          fi
          git commit -m "chore: 데이터 자동 갱신 (screener.db 스냅샷) [skip ci]"
          # 수집이 ~10분 걸리는 동안 개발 푸시로 origin이 움직이면 push가 non-fast-forward로
          # 거부된다(과거 실패 원인). push 전에 rebase로 원격 변경을 흡수하고 최대 5회 재시도.
          pushed=""
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=1; break
            fi
            echo "push 실패(원격이 갱신됨) — 재시도 $i/5"
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::screener.db push 실패(5회 재시도 후)"; exit 1
          fi
          # Render 배포 훅은 실패해도 데이터 push 성공을 망치지 않도록 비치명적 처리(-f 제거)
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -sS -X POST "$RENDER_DEPLOY_HOOK" && echo "Render 배포 트리거 완료" \
              || echo "::warning::Render 배포 훅 호출 실패 — 데이터 push는 성공(자동배포로 반영)"
          else
            echo "RENDER_DEPLOY_HOOK secret 미설정 — Render 자동배포에 의존"
          fi
